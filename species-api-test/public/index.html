<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thử nghiệm nhận diện loài</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 680px;
        margin: 40px auto;
        padding: 0 20px;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 320px;
        margin: 16px 0;
      }

      button {
        padding: 10px 18px;
        margin-top: 12px;
        cursor: pointer;
      }

      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f4f4f4;
        padding: 16px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Nhận diện loài</h1>
    <p>Chọn ảnh để gửi đến API nhận diện.</p>

    <input id="image" type="file" accept="image/*" />
    <img id="preview" alt="Ảnh xem trước" hidden />

    <br />
    <button id="identify">Nhận diện</button>

    <h2>Kết quả</h2>
    <pre id="result">Chưa có kết quả.</pre>

    <script>
      const imageInput = document.getElementById("image");
      const preview = document.getElementById("preview");
      const result = document.getElementById("result");
      const identifyButton = document.getElementById("identify");

      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (file) {
          preview.src = URL.createObjectURL(file);
          preview.hidden = false;
        } else {
          preview.hidden = true;
        }
      });

      identifyButton.addEventListener("click", async () => {
        const file = imageInput.files[0];

        if (!file) {
          result.textContent = "Vui lòng chọn một ảnh trước.";
          return;
        }

        const formData = new FormData();
        formData.append("image", file);

        identifyButton.disabled = true;
        result.textContent = "Đang gửi ảnh và chờ nhận diện...";

        try {
          const response = await fetch("/api/identify", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent = "Lỗi: " + error.message;
        } finally {
          identifyButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
