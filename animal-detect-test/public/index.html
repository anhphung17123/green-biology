<input id="imageInput" type="file" accept="image/*" />
<button id="identifyButton">Nhận diện động vật</button>

<pre id="result"></pre>

<script>
  const input = document.getElementById("imageInput");
  const button = document.getElementById("identifyButton");
  const result = document.getElementById("result");

  button.addEventListener("click", async () => {
    const file = input.files[0];

    if (!file) {
      result.textContent = "Vui lòng chọn ảnh trước.";
      return;
    }

    const formData = new FormData();
    formData.append("image", file);

    button.disabled = true;
    result.textContent = "Đang nhận diện...";

    try {
      const response = await fetch("/api/identify", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();

      result.textContent = JSON.stringify(data, null, 2);

      if (!response.ok) {
        result.textContent =
          `Lỗi HTTP ${response.status}\n` + JSON.stringify(data, null, 2);
      }
    } catch (error) {
      result.textContent = `Lỗi kết nối: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  });
</script>
