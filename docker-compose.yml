services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenbiology
      POSTGRES_USER: greenbiology
      POSTGRES_PASSWORD: greenbiology
    ports: ["55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenbiology"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
